version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # 11.x stored evidence files corrupted on Netlify (Nov 2026); stay on 10.x until fixed upstream
      - dependency-name: "@netlify/blobs"
        versions: [">=11"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
