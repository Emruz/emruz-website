# Tests and the security scan on every pull request and push to main.
# Job names are the required check names: tests, security-scan, dependency-review.
# Public repo (Full tier), so all three are required on main (see LAUNCH/repo-ci.md).
# Actions are pinned to commit SHAs.
name: Checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The checks scripts/ship.sh runs before pushing (the build runs locally and on Netlify)
      - run: npx tsc --noEmit
      - run: npm run -s lint
      - run: npm test

  security-scan:
    name: security-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Install Semgrep and gitleaks
        run: |
          pipx install semgrep==1.186.0
          curl -fsSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tgz" | sha256sum -c -
          tar xzf gitleaks.tgz -C "$RUNNER_TEMP" gitleaks && rm gitleaks.tgz
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Scan
        run: scripts/security-scan.sh --report "$RUNNER_TEMP/scan.md"
      - name: Summary
        if: always()
        run: cat "$RUNNER_TEMP/scan.md" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high
