# Review record check on every pull request. Template from repo-pr-review.
# No AI and no secrets: it only reads the committed record.
# Fails unless LAUNCH/reviews/<branch>.md exists at the PR head, its "Commit:"
# is the PR head's parent, the head commit changes only the record, and
# "Critical:" is 0. Dependabot PRs pass with a note.
# Job name is the required check name: pr-review-record (Full or Rules tier).
name: PR review record

on:
  pull_request:

permissions:
  contents: read

jobs:
  pr-review-record:
    name: pr-review-record
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      # Dependabot PRs have no review record: pass with a note. They still need the other
      # required checks, and the merge on GitHub is a person's decision.
      - name: Dependabot PR
        if: github.event.pull_request.user.login == 'dependabot[bot]'
        run: echo "Dependabot PR: no review record needed. Review the dependency change before merging." | tee -a "$GITHUB_STEP_SUMMARY"
      # Same check as the ship gate (scripts/ship-gate.sh record), so the two can't drift.
      # Don't use "Update branch" on GitHub: its merge commit changes more than the record.
      # Rebase on main locally and re-run the review instead.
      - name: Check record
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -uo pipefail
          scripts/ship-gate.sh record "$(git rev-parse HEAD)" "$HEAD_REF" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
