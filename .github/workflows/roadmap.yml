name: Add enhancements to roadmap

# The project's built-in auto-add workflow is used by the Motiv repo, so this
# repo adds its enhancement issues with an action instead. Closing the issue
# moves the card to Done through the project's own workflows.
on:
  issues:
    types: [opened, labeled]

permissions: {}

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v1.0.2
        with:
          project-url: https://github.com/orgs/Emruz/projects/1
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
          labeled: enhancement
