<!DOCTYPE html>
<html>
  <body>
    <!-- Netlify Forms detection. Field names must match src/app/contact/client.tsx -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="company" />
      <input name="topic" />
      <textarea name="message"></textarea>
    </form>
  </body>
</html>
